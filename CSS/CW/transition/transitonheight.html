<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            margin: 20px;
            width: 100px;
            height: 100px;
            background: rgb(90, 9, 90);
            transition: width 2s, height 2s, background-color 2s , transform 2s;

        div:hover {
            width: 400px;
            height: 400px;
            background-color: rgb(31, 9, 75);
            transform: rotate(90deg);
        }
    </style>
</head>

<body>

<div></div>

</body>

</html>
