<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            margin: 20px;
            width: 300px;
            height: 300px;
            background: rgb(90, 9, 90);
            transition: width 2s, height 2s, background-color 2s;
            
        }

        
        #div1 {
            transition-timing-function: linear;
        }

        #div2 {
            transition-timing-function: ease;
        }

        #div3 {
            transition-timing-function: ease-in;
        }

        #div4 {
            transition-timing-function: ease-out;
        }

        #div5 {
            transition-timing-function: ease-in-out;
        }

        div:hover {
            width: 400px;
            background-color: rgb(31, 9, 75);
            
        }
    </style>
</head>

<body>

<div id="div1"></div>
<div id="div2"></div>
<div id="div3"></div>
<div id="div4"></div>
<div id="div5"></div>

</body>

</html>
