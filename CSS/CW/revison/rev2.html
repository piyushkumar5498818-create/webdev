<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            position: relative;
            width: 500px;
            height: 400px;
            background-color: blue;
        }
        .top{
            position: absolute;
            top: 0px;
        }
        .bottom{   
            position: absolute;
            bottom: 0px;
        }
        .left{
            position: absolute;
            left: 0px;
        }
        .right{
            position: absolute;
            right: 0px;
        }

    </style>
</head>
<body>
    <div >
        <p class="top left">Piyush Kumar</p>
        <p class="top right">Piyush Kumar</p>
        <p class="bottom left">Piyush Kumar</p>
        <p class="bottom right">Piyush Kumar</p>
    </div>
</body>
</html>
