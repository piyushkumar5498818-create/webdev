<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        div {
            position: relative;
            width: 500px;
            height: 400px;
            background-color: blue;
        }
        .centre.left{
            position: absolute;
            top: 50%;
            left: 0px;
        }
        .centre.right{
            position: absolute;
            top: 50%;
            right: 0px;
        }
        .centre.top{
            position: absolute;
            top: 0px;
            left: 50%;
        }
        .centre.bottom{
            position: absolute;
            bottom: 0px;
            left: 50%;
        }
    </style>
</head>

<body>
    <div>
        <p class="top centre">Piyush Kumar</p>
        <p class="left centre">Piyush Kumar</p>
        <p class="centre bottom">Piyush Kumar</p>
        <p class="centre right">Piyush Kumar</p>

    </div>
</body>
</html>
